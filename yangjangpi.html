<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><title>Chinesische Küche - 양장피</title>
    <style>
        :root { --primary: #2C1E16; --accent: #D62828; --bg: #FDFBF7; }
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background-color: var(--bg); }
        header { padding: 20px 60px; background: #fff; text-align: center; }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-decoration: none; }
        .container { max-width: 800px; margin: 50px auto; background: white; padding: 50px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .food-img { width: 100%; height: 400px; object-fit: cover; border-radius: 15px; margin-bottom: 30px; }
        h1 { color: var(--primary); border-left: 6px solid var(--accent); padding-left: 20px; }
        .info-box { background: #f9f9f9; padding: 25px; border-radius: 10px; margin-top: 20px; }
        .back { display: block; text-align: center; margin-top: 40px; color: var(--accent); font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">uno sportello <span style="color:var(--accent)">unico</span></a></header>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1547592180-85f173990554?q=80&w=800" class="food-img">
        <h1>화려한 조화, 양장피</h1>
        <p>전분으로 만든 피와 다채로운 해산물, 야채를 톡 쏘는 겨자 소스에 비벼 먹는 고급 요리입니다. 오감을 자극하는 화려한 비주얼을 자랑합니다.</p>
        <div class="info-box">
            <h3>핵심 식재료</h3>
            <p>✔ 고구마 전분피, ✔ 신선한 해산물 채, ✔ 알싸한 겨자소스, ✔ 볶음야채</p>
            <h3>건강 정보</h3>
            <p>다양한 야채와 해산물을 익혀서 무쳐 먹는 요리로 중화요리 중 가장 칼로리가 낮은 편에 속합니다.</p>
        </div>
        <a href="menu.html" class="back">← 메뉴판으로 돌아가기</a>
    </div>
</body>
</html>
