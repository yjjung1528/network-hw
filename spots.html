<!DOCTYPE html>
<html lang="ko">
<head>

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 60px; background: #fff; }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-decoration: none; }

        .container { max-width: 900px; margin: 60px auto; padding: 0 20px; }
        .spot-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border-left: 8px solid var(--accent); }
        h3 { margin: 0 0 10px 0; color: var(--primary); }
        p { margin: 5px 0; color: #666; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Chinesische <span>Küche</span></a>
        <nav><a href="history.html">중화요리</a><a href="menu.html">메뉴소개</a><a href="spots.html" style="color:var(--accent)">주변 맛집</a></nav>
    </header>
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 50px;">내 주변 중화요리 맛집</h1>
        <div class="spot-card"><h3>대성루 (전통 수타면 전문)</h3><p>📍 위치: 학교 정문 도보 5분 거리</p><p>⭐ 특징: 사장님이 직접 치는 수타면의 쫄깃함이 일품입니다.</p></div>
        <div class="spot-card"><h3>홍콩반점 (가성비 최고)</h3><p>📍 위치: 시내 중앙 사거리</p><p>⭐ 특징: 불맛 가득한 짬뽕과 얇은 단무지의 조화가 완벽합니다.</p></div>
    </div>

</html>
