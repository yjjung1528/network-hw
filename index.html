<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinesische Küche - 홈</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2C1E16; --accent: #D62828; --bg: #FDFBF7; --text: #333333; }
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background-color: var(--bg); color: var(--text); }
        a { text-decoration: none; color: inherit; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: #ffffff; box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: var(--primary); }
        .logo span { color: var(--accent); }
        .nav-menu { display: flex; gap: 40px; font-weight: 700; }
        .nav-menu a:hover { color: var(--accent); transition: 0.3s; }

        .hero {
            background-color: var(--primary); color: #ffffff; padding: 180px 20px; text-align: center;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&q=80&w=1200');
            background-size: cover; background-position: center; min-height: 40vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .hero h1 { font-size: 4rem; margin: 0 0 20px 0; font-family: 'Playfair Display', serif; }
        .hero p { font-size: 1.5rem; opacity: 0.9; font-weight: 400; }
        
        footer { background: var(--primary); color: rgba(255,255,255,0.6); text-align: center; padding: 40px; font-size: 0.9rem; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Chinesische <span>Küche</span></div>
        <nav class="nav-menu">
            <a href="history.html">중화요리</a>
            <a href="menu.html">메뉴소개</a>
            <a href="spots.html">주변 맛집</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Chinesische Küche</h1>
        <p>한국인의 취향에 맞게 현지화된 중화요리</p>
    </div>

    <footer>
        &copy; 2026 Chinesische Küche. 미니프로젝트 과제 제출용
    </footer>

</body>
</html>
