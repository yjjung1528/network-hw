<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Chinesische Küche - Home</title>
    <style>
        :root { --primary: #2C1E16; --accent: #D62828; --bg: #FDFBF7; }
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background-color: var(--bg); overflow-x: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 60px; background: #fff; box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-decoration: none; }
        .logo span { color: var(--accent); }
        nav a { margin-left: 40px; text-decoration: none; font-weight: 700; color: var(--primary); transition: 0.3s; }
        nav a:hover { color: var(--accent); }
        .hero { height: 85vh; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://img.hankyung.com/photo/202507/01.41124649.1.jpg'); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; }
        .hero h1 { font-size: 5rem; margin: 0; font-weight: 900; letter-spacing: -2px; }
        .hero p { font-size: 1.6rem; margin-top: 20px; font-weight: 300; }
        footer { background: var(--primary); color: rgba(255,255,255,0.6); text-align: center; padding: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Chinesische <span>Küche</span></a>
        <nav>
            <a href="history.html">중화요리</a>
            <a href="menu.html">메뉴소개</a>
            <a href="spots.html">주변 맛집</a>
        </nav>
    </header>
    <div class="hero">
        <h1>Chinesische Küche</h1>
        <p>한국인의 취향에 맞게 현지화된 중화요리</p>
    </div>
    <footer>&copy; 2026 Chinesische Küche. 과제 제출용 미니 프로젝트</footer>
</body>
</html>
