        .menu-card { background: #ffffff; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.05); transition: 0.3s; text-align: center;}
        .menu-card:hover { transform: translateY(-8px); }
        .menu-img { width: 100%; height: 220px; object-fit: cover; }
        .menu-info { padding: 25px; }
        .menu-info h3 { margin: 0 0 15px 0; font-size: 1.4rem; color: var(--primary); }
        .detail-btn { display: inline-block; padding: 10px 25px; background: var(--accent); color: white; border-radius: 5px; font-weight: bold; font-size: 0.9rem; transition: 0.2s;}
