<!DOCTYPE html>
<html lang="ko">
<head>

        h1 { color: var(--primary); border-left: 6px solid var(--accent); padding-left: 20px; }
        .info-box { background: #f9f9f9; padding: 25px; border-radius: 10px; margin-top: 20px; }

<body>
    <header><a href="index.html" class="logo">Chinesische <span style="color:var(--accent)">Küche</span></a></header>
    <div class="container">
        <img src="https://blog.kakaocdn.net/dna/eEGBlq/btsN4br6f2H/AAAAAAAAAAAAAAAAAAAAAIprMSHdw2yw0g6DYmBdRTmXU_9A-7oPwT7FNsAL2qdH/img.jpg?credential=yqXZFxpELC7KVnFOS48ylbz2pIh7yKj8&expires=1780239599&allow_ip=&allow_referer=&signature=v7q17EF3v8ggu6kMZEvwSpO9fEA%3D" class="food-img">

            <p>한 입 깨물었을 때 톡 터지는 새우의 식감과 입안을 가득 채우는 소스의 풍미가 완벽한 조화를 이룹니다.</p>
        </div>
