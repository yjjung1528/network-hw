<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><title>Chinesische Küche - 깐풍기</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2C1E16; --accent: #D62828; --bg: #FDFBF7; }
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background-color: var(--bg); }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: #ffffff; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); } .logo span { color: var(--accent); }
        .container { padding: 50px 20px; max-width: 800px; margin: 0 auto; }
        .back-btn { display: inline-block; margin-bottom: 25px; color: var(--accent); font-weight: bold; text-decoration: none; }
        .food-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .food-img { width: 100%; height: 350px; object-fit: cover; border-radius: 10px; margin-bottom: 30px; }
        h2 { color: var(--primary); border-left: 5px solid var(--accent); padding-left: 15px; margin: 0 0 20px 0; }
        .list { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .item { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
    </style>
</head>
<body>
    <header><div class="logo">Chinesische <span>Küche</span></div></header>
    <div class="container">
        <a href="menu.html" class="back-btn">&larr; 메뉴판으로 돌아가기</a>
        <div class="food-box">
            <img src="https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&q=80&w=800" class="food-img" alt="깐풍기">
            <h2>깐풍기 (Kkanpunggi)</h2>
            <div class="list">
                <div class="item"><strong>핵심 식재료:</strong> 닭다리 순살, 사천 쥐똥고추, 특제 양조식초, 마늘 다짐소스</div>
                <div class="item"><strong>요리 특징:</strong> 바삭하게 튀긴 닭고기를 소스가 흥건하지 않고 바짝 메마르게 조려내는 '깐풍' 조리법을 사용해 매콤함, 달콤함, 새콤함을 동시에 구현한 일품 요리입니다.</div>
            </div>
        </div>
    </div>
</body>
</html>
